<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engineering Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0D12;
    --ink-elevated:#12161C;
    --hairline:#242A33;
    --paper:#E6EAEE;
    --paper-dim:#8F98A3;
    --paper-faint:#525960;
    --steel:#6B9BC3;
    --steel-dim:#3C5A73;
    --measure:640px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 600px at 50% -10%, #151A21 0%, var(--ink) 60%);
    background-attachment:fixed;
    color:var(--paper);
    font-family:'Inter', ui-sans-serif, system-ui, sans-serif;
    font-size:16px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3,.serif{font-family:'Fraunces', Georgia, serif;}

  a{color:inherit; text-decoration:none;}
  :focus-visible{outline:1px solid var(--steel); outline-offset:3px;}

  .fade-in{animation:fadeIn 1.1s ease both;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- top nav ---------- */
  .topnav{
    position:sticky;
    top:0;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 48px;
    background:rgba(10,13,18,0.82);
    backdrop-filter:blur(6px);
    border-bottom:1px solid transparent;
    transition:border-color 0.3s ease;
  }
  .topnav.scrolled{border-bottom-color:var(--hairline);}
  .mark{
    font-family:'Fraunces', serif;
    font-size:17px;
    font-style:italic;
    font-weight:500;
    letter-spacing:0.01em;
  }
  .nav-links{display:flex; gap:34px; list-style:none; margin:0; padding:0;}
  .nav-links button{
    background:none; border:none; cursor:pointer; font-family:'Inter', sans-serif;
    color:var(--paper-dim); font-size:13px; letter-spacing:0.03em; padding:4px 0;
    position:relative;
  }
  .nav-links button::after{
    content:''; position:absolute; left:0; right:0; bottom:-2px; height:1px;
    background:var(--steel); transform:scaleX(0); transform-origin:left;
    transition:transform 0.25s ease;
  }
  .nav-links button:hover, .nav-links button.active{color:var(--paper);}
  .nav-links button.active::after, .nav-links button:hover::after{transform:scaleX(1);}
  .nav-toggle{display:none;}

  @media (max-width:760px){
    .topnav{padding:18px 24px;}
    .nav-links{
      position:fixed; top:0; right:0; height:100vh; width:min(280px, 78vw);
      background:var(--ink-elevated); border-left:1px solid var(--hairline);
      flex-direction:column; padding:90px 32px; gap:26px;
      transform:translateX(100%); transition:transform 0.3s ease;
    }
    .nav-links.open{transform:translateX(0);}
    .nav-toggle{
      display:block; background:none; border:none; color:var(--paper); cursor:pointer;
      font-size:22px; line-height:1; z-index:40;
    }
  }

  /* ---------- shared section rhythm ---------- */
  .wrap{max-width:920px; margin:0 auto; padding:0 48px;}
  @media (max-width:760px){.wrap{padding:0 24px;}}

  section{padding:96px 0;}
  section + section{border-top:1px solid var(--hairline);}

  .eyebrow{
    font-size:13px; color:var(--steel); font-style:italic; font-family:'Fraunces', serif;
    margin:0 0 10px;
  }
  h2.title{font-size:clamp(28px,4vw,38px); font-weight:500; margin:0 0 40px; max-width:520px;}

  .rivet-line{
    height:1px;
    background-image:radial-gradient(circle, var(--hairline) 1px, transparent 1.2px);
    background-size:11px 1px;
    background-repeat:repeat-x;
    background-position:left center;
  }

  /* ---------- photo slots ----------
     Empty by default. Drop a real URL or file path into CONFIG.images
     below and these automatically switch from placeholder to photo. */
  .photo-slot{
    position:relative;
    overflow:hidden;
    background:var(--ink-elevated);
    border:1px dashed var(--hairline);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .photo-slot img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .photo-slot.empty img{display:none;}
  .photo-slot .slot-label{
    display:none;
    padding:20px;
    color:var(--paper-faint);
    font-size:11.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    line-height:1.8;
  }
  .photo-slot.empty .slot-label{display:block;}
  .plate-cap{
    display:flex; justify-content:space-between; margin-top:14px;
    font-size:10.5px; letter-spacing:0.06em; color:var(--paper-faint); text-transform:uppercase;
  }

  /* ---------- hero ---------- */
  .hero{padding:150px 0 110px;}
  .hero-grid{display:grid; grid-template-columns:1fr 380px; gap:56px; align-items:center;}
  @media (max-width:900px){.hero-grid{grid-template-columns:1fr;}}
  .hero-photo{aspect-ratio:4/5;}
  @media (max-width:900px){.hero-photo{aspect-ratio:16/9;}}
  .hero-eyebrow{
    color:var(--paper-faint); font-size:12px; letter-spacing:0.08em; margin-bottom:22px;
    text-transform:uppercase;
  }
  .hero h1{
    font-size:clamp(36px, 6vw, 64px);
    font-weight:500;
    line-height:1.05;
    margin:0;
  }
  .hero h1 em{color:var(--steel); font-style:italic; font-weight:400;}
  .hero .role{
    margin-top:26px; font-size:19px; color:var(--paper-dim); max-width:520px; font-weight:400;
  }
  .rule{width:64px; height:1px; background:var(--steel); margin:38px 0 0;}

  /* ---------- about ---------- */
  .about-grid{display:grid; grid-template-columns:1fr 260px; gap:56px; align-items:start;}
  @media (max-width:760px){.about-grid{grid-template-columns:1fr;}}
  .bio{max-width:var(--measure); font-size:17px; color:var(--paper-dim);}
  .bio p{margin:0 0 20px;}
  .bio p:first-of-type::first-letter{
    font-family:'Fraunces', serif; font-size:3.4em; float:left; line-height:0.85;
    padding:6px 10px 0 0; color:var(--paper); font-weight:500;
  }
  .about-photo{aspect-ratio:3/4;}

  /* ---------- photo band (between experience and work) ---------- */
  .photo-band-wrap{padding:0; border-top:1px solid var(--hairline);}
  .photo-band{height:320px; border-left:none; border-right:none; border-radius:0;}
  @media (max-width:760px){.photo-band{height:220px;}}
  .photo-band-cap{
    max-width:920px; margin:14px auto 0; padding:0 48px;
    display:flex; justify-content:space-between;
    font-size:10.5px; letter-spacing:0.06em; color:var(--paper-faint); text-transform:uppercase;
  }
  @media (max-width:760px){.photo-band-cap{padding:0 24px;}}

  /* ---------- experience ---------- */
  .timeline{display:flex; flex-direction:column;}
  .tl-entry{display:grid; grid-template-columns:140px 1fr; gap:28px; padding:34px 0;}
  .tl-entry:first-child{padding-top:0;}
  .tl-period{color:var(--steel); font-size:13px; padding-top:4px; font-family:'Fraunces', serif; font-style:italic;}
  .tl-role{font-family:'Fraunces', serif; font-size:21px; font-weight:500;}
  .tl-company{color:var(--paper-dim); font-size:14px; margin-top:2px;}
  .tl-desc{color:var(--paper-dim); font-size:15px; margin-top:14px; max-width:560px; line-height:1.75;}
  .tl-tags{margin-top:16px; font-size:12.5px; color:var(--paper-faint);}
  .tl-tags span:not(:last-child)::after{content:' · '; color:var(--hairline);}

  @media (max-width:600px){
    .tl-entry{grid-template-columns:1fr; gap:8px;}
  }

  /* ---------- work / projects ---------- */
  .work-list{display:flex; flex-direction:column;}
  .work-entry{
    padding:32px 0;
    display:grid; grid-template-columns:1fr auto; gap:20px; align-items:baseline;
  }
  .work-entry:first-child{padding-top:0;}
  .work-name{font-family:'Fraunces', serif; font-size:24px; font-weight:500;}
  .work-status{font-size:11.5px; color:var(--paper-faint); text-align:right; white-space:nowrap;}
  .work-desc{grid-column:1 / -1; color:var(--paper-dim); font-size:15px; max-width:600px; margin-top:8px; line-height:1.75;}
  .work-meta{grid-column:1 / -1; font-size:12.5px; color:var(--paper-faint); margin-top:12px;}
  .work-meta span:not(:last-child)::after{content:' · '; color:var(--hairline);}

  /* ---------- skills ---------- */
  .skills-grid{display:grid; grid-template-columns:1fr 1fr; gap:36px 48px;}
  @media (max-width:600px){.skills-grid{grid-template-columns:1fr;}}
  .skill-cat h3{
    font-family:'Fraunces', serif; font-style:italic; font-weight:400; font-size:16px;
    color:var(--steel); margin:0 0 10px;
  }
  .skill-cat p{margin:0; color:var(--paper-dim); font-size:15px; line-height:1.8;}

  /* ---------- contact ---------- */
  .contact h2.title{max-width:none;}
  .contact-lead{color:var(--paper-dim); font-size:17px; max-width:var(--measure); margin-bottom:44px;}
  .contact-email{
    font-family:'Fraunces', serif; font-style:italic; font-weight:400;
    font-size:clamp(26px, 4vw, 40px); color:var(--paper);
    display:inline-block; padding-bottom:6px; border-bottom:1px solid var(--hairline);
    transition:border-color 0.25s ease, color 0.25s ease;
  }
  .contact-email:hover{color:var(--steel); border-color:var(--steel);}
  .contact-links{margin-top:36px; display:flex; gap:28px; font-size:14px; color:var(--paper-dim); flex-wrap:wrap;}
  .contact-links a:hover{color:var(--steel);}

  footer{padding:40px 48px 60px; text-align:center; color:var(--paper-faint); font-size:12.5px;}
</style>
</head>
<body>

<nav class="topnav" id="topnav">
  <div class="mark" id="mark"></div>
  <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">☰</button>
  <ul class="nav-links" id="navLinks">
    <li><button data-target="about">About</button></li>
    <li><button data-target="experience">Experience</button></li>
    <li><button data-target="work">Work</button></li>
    <li><button data-target="skills">Skills</button></li>
    <li><button data-target="contact">Contact</button></li>
  </ul>
</nav>

<header class="hero wrap fade-in">
  <div class="hero-grid">
    <div>
      <div class="hero-eyebrow" id="heroLocation"></div>
      <h1 id="heroName"></h1>
      <p class="role" id="heroRole"></p>
      <div class="rule"></div>
    </div>
    <div>
      <div class="photo-slot hero-photo empty" id="heroPhotoSlot">
        <img id="heroPhotoImg" alt="">
        <div class="slot-label">1200 × 1500<br>Add a photo of yourself<br>or your work</div>
      </div>
      <div class="plate-cap"><span>Fig. 01</span><span id="heroPhotoCaption">Portrait</span></div>
    </div>
  </div>
</header>

<section id="about">
  <div class="wrap">
    <div class="eyebrow">01</div>
    <h2 class="title">About</h2>
    <div class="about-grid">
      <div class="bio" id="bioText"></div>
      <div>
        <div class="photo-slot about-photo empty" id="aboutPhotoSlot">
          <img id="aboutPhotoImg" alt="">
          <div class="slot-label">900 × 1200<br>Add a project or workspace photo</div>
        </div>
        <div class="plate-cap"><span>Fig. 02</span><span id="aboutPhotoCaption">On the floor</span></div>
      </div>
    </div>
  </div>
</section>

<section id="experience">
  <div class="wrap">
    <div class="eyebrow">02</div>
    <h2 class="title">Experience</h2>
    <div class="timeline" id="timeline"></div>
  </div>
</section>

<div class="photo-band-wrap">
  <div class="photo-slot photo-band empty" id="bandPhotoSlot">
    <img id="bandPhotoImg" alt="">
    <div class="slot-label">1800 × 700 — wide banner<br>A hangar, cleanroom, or shop-floor shot works well here</div>
  </div>
  <div class="photo-band-cap"><span>Fig. 03</span><span id="bandPhotoCaption">On site</span></div>
</div>

<section id="work">
  <div class="wrap">
    <div class="eyebrow">03</div>
    <h2 class="title">Selected work</h2>
    <div class="work-list" id="workList"></div>
  </div>
</section>

<section id="skills">
  <div class="wrap">
    <div class="eyebrow">04</div>
    <h2 class="title">Skills</h2>
    <div class="skills-grid" id="skillsGrid"></div>
  </div>
</section>

<section id="contact" class="contact">
  <div class="wrap">
    <div class="eyebrow">05</div>
    <h2 class="title">Get in touch</h2>
    <p class="contact-lead" id="contactLead"></p>
    <a class="contact-email" id="contactEmail" href="#"></a>
    <div class="contact-links" id="contactLinks"></div>
  </div>
</section>

<footer id="footerText"></footer>

<script>
/* =====================================================================
   EVERYTHING BELOW IS THE ONE PLACE YOU NEED TO EDIT.
   Change the values in CONFIG and the whole site updates.

   TO ADD PHOTOS: fill in the "src" fields inside CONFIG.images with a
   URL or a relative file path (e.g. "images/hero.jpg" if you keep an
   /images folder next to this file). Leave src as "" to keep the
   dashed placeholder showing.
   ===================================================================== */
const CONFIG = {
  name: "Jordan Reyes",
  role: "Software engineer focused on backend systems and infrastructure — six years building things that stay up at 3am.",
  location: "Seattle, WA",

  bio: [
    "I build backend systems and developer tooling, mostly in Go and TypeScript. Six years in, currently focused on distributed systems and making infrastructure boring in the best way.",
    "Outside of work I contribute to a couple of open-source CLI tools and I'm slowly working through a home Kubernetes cluster that is, admittedly, overkill for what it does."
  ],

  images: {
    hero:  { src: "", alt: "Portrait", caption: "Portrait" },
    about: { src: "", alt: "On the shop floor", caption: "On the floor" },
    band:  { src: "", alt: "Facility or hangar photo", caption: "On site" }
  },

  experience: [
    {
      role: "Senior Backend Engineer",
      company: "Northwind Cloud",
      period: "2023 — Present",
      desc: "Own the event-processing pipeline handling roughly 40,000 events per second. Led the migration from a monolithic queue consumer to a sharded worker pool, cutting p99 latency by 61%.",
      tags: ["Go", "Kafka", "Kubernetes"]
    },
    {
      role: "Backend Engineer",
      company: "Fernwood Systems",
      period: "2021 — 2023",
      desc: "Built the internal billing service from scratch, processing invoices for roughly 12,000 customers. Introduced contract testing between services, which ended a long stretch of integration incidents.",
      tags: ["TypeScript", "PostgreSQL", "gRPC"]
    },
    {
      role: "Software Engineer, New Grad",
      company: "Delta Robotics",
      period: "2019 — 2021",
      desc: "Wrote firmware-adjacent tooling for warehouse robots and the fleet dashboard used by ops teams to monitor them in real time.",
      tags: ["Python", "ROS", "React"]
    }
  ],

  projects: [
    {
      name: "shardq",
      statusLabel: "Production",
      desc: "A lightweight sharded job queue for Go services, built to replace a Redis-based queue that couldn't scale past a single node.",
      meta: ["Go", "Used in 3 production services"],
      link: "#"
    },
    {
      name: "dotctl",
      statusLabel: "Open source",
      desc: "A dotfiles manager with per-machine profiles and encrypted secrets, written because every existing one did 90% of what I needed.",
      meta: ["Rust", "~600 GitHub stars"],
      link: "#"
    },
    {
      name: "flowtrace",
      statusLabel: "Prototype",
      desc: "A request-tracing visualizer that renders service call graphs from OpenTelemetry spans directly in the terminal.",
      meta: ["Go", "Personal project, in progress"],
      link: "#"
    },
    {
      name: "billing-core",
      statusLabel: "Production",
      desc: "Invoice generation and proration engine handling edge cases around plan changes, refunds, and multi-currency billing.",
      meta: ["TypeScript", "Processes ~12k invoices/mo"],
      link: "#"
    }
  ],

  skills: {
    Languages: "Go, TypeScript, Python, Rust",
    Infrastructure: "Kubernetes, Terraform, Kafka, AWS",
    Databases: "PostgreSQL, Redis, DynamoDB",
    Practices: "Distributed systems, API design, CI/CD, on-call"
  },

  contact: {
    lead: "Open to conversations about backend systems, infrastructure, or roles where both matter. The fastest way to reach me is email.",
    email: "jordan@example.com",
    github: "github.com/jordanreyes",
    linkedin: "linkedin.com/in/jordanreyes",
    resumeUrl: ""   // leave blank to hide this link
  }
};
/* ===================================================================== */

const $ = (sel, el=document) => el.querySelector(sel);
const $$ = (sel, el=document) => Array.from(el.querySelectorAll(sel));

function initials(name){
  return name.split(' ').map(w => w[0]).join('').toUpperCase();
}

function fillPhotoSlot(slotId, imgId, captionId, cfg){
  const slot = document.getElementById(slotId);
  const img = document.getElementById(imgId);
  const cap = captionId ? document.getElementById(captionId) : null;
  if(cfg.src){
    img.src = cfg.src;
    img.alt = cfg.alt || '';
    slot.classList.remove('empty');
  } else {
    slot.classList.add('empty');
  }
  if(cap && cfg.caption) cap.textContent = cfg.caption;
}

// ---- masthead / hero ----
$('#mark').textContent = initials(CONFIG.name);
document.title = CONFIG.name + " — Engineering Portfolio";
$('#heroLocation').textContent = CONFIG.location;
$('#heroName').innerHTML = CONFIG.name.replace(/(\s\S+)$/, ' <em>$1</em>');
$('#heroRole').textContent = CONFIG.role;

$('#bioText').innerHTML = CONFIG.bio.map(p => `<p>${p}</p>`).join('');

// ---- photo slots ----
fillPhotoSlot('heroPhotoSlot', 'heroPhotoImg', 'heroPhotoCaption', CONFIG.images.hero);
fillPhotoSlot('aboutPhotoSlot', 'aboutPhotoImg', 'aboutPhotoCaption', CONFIG.images.about);
fillPhotoSlot('bandPhotoSlot', 'bandPhotoImg', 'bandPhotoCaption', CONFIG.images.band);

// ---- experience ----
$('#timeline').innerHTML = CONFIG.experience.map((e, i) => `
  ${i > 0 ? '<div class="rivet-line"></div>' : ''}
  <div class="tl-entry">
    <div class="tl-period">${e.period}</div>
    <div>
      <div class="tl-role">${e.role}</div>
      <div class="tl-company">${e.company}</div>
      <div class="tl-desc">${e.desc}</div>
      <div class="tl-tags">${e.tags.map(t => `<span>${t}</span>`).join('')}</div>
    </div>
  </div>
`).join('');

// ---- work ----
$('#workList').innerHTML = CONFIG.projects.map((p, i) => `
  ${i > 0 ? '<div class="rivet-line"></div>' : ''}
  <div class="work-entry">
    <a class="work-name" href="${p.link}">${p.name}</a>
    <div class="work-status">${p.statusLabel}</div>
    <div class="work-desc">${p.desc}</div>
    <div class="work-meta">${p.meta.map(m => `<span>${m}</span>`).join('')}</div>
  </div>
`).join('');

// ---- skills ----
$('#skillsGrid').innerHTML = Object.entries(CONFIG.skills).map(([cat, list]) => `
  <div class="skill-cat">
    <h3>${cat}</h3>
    <p>${list}</p>
  </div>
`).join('');

// ---- contact ----
$('#contactLead').textContent = CONFIG.contact.lead;
$('#contactEmail').textContent = CONFIG.contact.email;
$('#contactEmail').href = 'mailto:' + CONFIG.contact.email;
let contactLinksHtml = `
  <a href="https://${CONFIG.contact.github}" target="_blank" rel="noopener">GitHub</a>
  <a href="https://${CONFIG.contact.linkedin}" target="_blank" rel="noopener">LinkedIn</a>
`;
if(CONFIG.contact.resumeUrl){
  contactLinksHtml += `<a href="${CONFIG.contact.resumeUrl}" target="_blank" rel="noopener">Résumé</a>`;
}
$('#contactLinks').innerHTML = contactLinksHtml;

$('#footerText').textContent = `${CONFIG.name}. ${new Date().getFullYear()}.`;

// ---- nav toggle (mobile) ----
const navToggle = $('#navToggle');
const navLinks = $('#navLinks');
navToggle.addEventListener('click', () => navLinks.classList.toggle('open'));

// ---- nav click + scrollspy ----
const navButtons = $$('.nav-links button');
navButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    document.getElementById(btn.dataset.target).scrollIntoView({behavior:'smooth'});
    navLinks.classList.remove('open');
  });
});

const sections = $$('section[id]');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if(entry.isIntersecting){
      navButtons.forEach(b => b.classList.toggle('active', b.dataset.target === entry.target.id));
    }
  });
}, { rootMargin: '-40% 0px -55% 0px', threshold: 0 });
sections.forEach(s => observer.observe(s));

// ---- sticky nav border on scroll ----
const topnav = $('#topnav');
window.addEventListener('scroll', () => {
  topnav.classList.toggle('scrolled', window.scrollY > 8);
}, { passive: true });
</script>

</body>
</html>
